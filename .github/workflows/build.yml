from pathlib import Path

content = r'''name: Build HEXED Samp RPC native libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (supported packages only)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.0.12077973' \
            'cmake;3.22.1'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [[ -z "${ZIP_FILE}" ]]; then
            echo "ERROR: Upload the source ZIP to the repository root."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/hexed-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          CMAKE_FILE="$(find "$EXTRACT_DIR" -type f -path '*/app/src/main/cpp/CMakeLists.txt' -print -quit)"
          if [[ -z "${CMAKE_FILE}" ]]; then
            echo "ERROR: Could not find app/src/main/cpp/CMakeLists.txt in the ZIP."
            echo "Check that the uploaded ZIP contains the Android project source."
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$CMAKE_FILE")/../../../../.." && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Compile native libraries
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:externalNativeBuildDebug
          else
            gradle --no-daemon :app:externalNativeBuildDebug
          fi

      - name: Collect compiled shared libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native-so
          find "$PROJECT_DIR/app/build" -type f -name '*.so' -print
          while IFS= read -r so_file; do
            [[ -n "$so_file" ]] || continue
            rel_path="${so_file#"$PROJECT_DIR/app/build/"}"
            mkdir -p "dist/native-so/$(dirname "$rel_path")"
            cp "$so_file" "dist/native-so/$rel_path"
          done < <(find "$PROJECT_DIR/app/build" -type f -name '*.so')

          if ! find dist/native-so -type f -name '*.so' -print -quit | grep -q .; then
            echo "ERROR: No .so files were generated. Check the Gradle/CMake build logs."
            exit 1
          fi

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: HEXED-Samp-RPC-native-so
          path: dist/native-so/
          if-no-files-found: error
          retention-days: 14
'''
p=Path("/mnt/data/build.yml")
p.write_text(content)
print(f"Created corrected workflow: {p} ({p.stat().st_size} bytes)")
